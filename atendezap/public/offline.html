<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VeloHUB — Sem conexão</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100dvh;
    background: #081410;
    color: #f1f9f4;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: grid;
    place-items: center;
    padding: 24px;
    text-align: center;
  }
  .icon {
    width: 64px;
    height: 64px;
    background: rgba(14,250,113,.12);
    border-radius: 20px;
    display: grid;
    place-items: center;
    margin: 0 auto 20px;
    border: 1px solid rgba(14,250,113,.2);
  }
  svg { color: #0efa71; }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  p { color: #b4cec0; font-size: 15px; line-height: 1.6; max-width: 300px; }
  button {
    margin-top: 28px;
    background: #0efa71;
    color: #04140b;
    border: none;
    border-radius: 12px;
    padding: 12px 28px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div>
    <div class="icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18.36 6.64A9 9 0 0 1 20.77 15"/>
        <path d="M6.16 6.16a9 9 0 1 0 12.68 12.68"/>
        <line x1="2" y1="2" x2="22" y2="22"/>
      </svg>
    </div>
    <h1>Sem conexão</h1>
    <p>Verifique sua internet e tente novamente. Seus dados ficam salvos no servidor.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
