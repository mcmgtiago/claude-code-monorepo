<!-- herp section -->
<section
  class="relative overflow-hidden pt-[130px] pb-[86px] md:pt-[100px] lg:pt-[174px]"
  aria-labelledby="hero-heading"
>
  <div class="main-container">
    <div class="relative">
      <!--  content  -->
      <div class="space-y-14">
        <!-- text  -->
        <div class="space-y-4">
          <h1
            id="hero-heading"
            data-text-reveal
            class="font-sora text-sora-heading-3 md:text-sora-heading-2 lg:text-sora-heading-1 mx-auto max-w-[950px] text-center font-normal tracking-[-3.2px]"
          >
            AI that transforms businesses, drives growth
          </h1>
          <p
            data-text-reveal
            data-delay="0.2"
            class="text-tagline-1 text-background-13/60 mx-auto max-w-[650px] text-center font-normal"
          >
            Harness the power of intelligent solutions to simplify workflows, boost efficiency, and
            stay ahead of the competition.
          </p>
        </div>
        <!-- btn  -->
        <div data-opai-animate data-delay="0.3" data-instant class="text-center">
          <Component
            src="src/components/shared/button/link-primary.htm"
            button-text="Request a demo"
            href="./pricing.html"
          />
        </div>
      </div>
      <!-- img -->
      <figure data-opai-animate data-delay="0.4" data-instant class="mx-auto md:size-[709px]">
        <img
          src="./images/opai-img-300.png"
          alt="AI technology transforming business operations"
          class="hero-img-animate size-full object-cover"
        />
      </figure>

      <!-- card one (left) -->

      <div
        data-move-up-on-scroll-element
        data-opai-animate
        data-delay="0.5"
        data-instant
        class="lp:left-[-2%] absolute top-[30%] left-[2%] hidden xl:block 2xl:left-[-7%]"
      >
        <div class="relative h-[229px] w-[289px] rounded-3xl bg-white p-11">
          <!-- slice one  -->
          <div
            data-opai-animate
            data-delay="0.6"
            data-instant
            class="bg-background-3 relative z-10 flex w-full max-w-[200px] rotate-6 items-center justify-center gap-x-4 rounded-xl p-2.5"
            aria-label="Team member card"
          >
            <figure class="size-11 overflow-hidden rounded-lg">
              <img
                src="./images/opai-avatar-img-02.png"
                alt="Wade Warren, Marketing coordinator"
                class="size-full object-cover"
                itemprop="image"
              />
            </figure>
            <div>
              <p class="text-tagline-2 font-sora tracking-[-0.48px] text-white" itemprop="name">
                wade warren
              </p>
              <p class="font-inter-tight text-tagline-4 text-white/60" itemprop="jobTitle">
                Marketing coordinator
              </p>
            </div>
          </div>

          <!-- slice two -->
          <div
            data-opai-animate
            data-delay="0.7"
            data-instant
            class="bg-background-13/20 absolute bottom-[92px] h-[62px] w-full max-w-[200px] -rotate-8 rounded-xl p-2.5"
            aria-hidden="true"
          ></div>

          <!-- slice three -->
          <div
            data-opai-animate
            data-delay="0.8"
            data-instant
            class="bg-background-13/20 absolute h-[62px] w-full max-w-[200px] rotate-6 rounded-xl p-2.5"
            aria-hidden="true"
          ></div>
        </div>
      </div>

      <!-- card two (right)  -->
      <div
        data-move-up-on-scroll-element
        data-move-up-value="15"
        data-opai-animate
        data-delay="0.6"
        data-instant
        data-direction="right"
        data-offset="100"
        class="lp:right-[2%] absolute top-[77%] right-[1%] hidden md:inline-block lg:top-[40%] xl:right-[5%] 2xl:right-[-6%]"
        role="complementary"
        aria-label="Development team statistics"
      >
        <div class="w-[280px] space-y-6 rounded-3xl bg-white px-11 py-11 lg:py-14 xl:w-[323px]">
          <div class="space-y-[35px] text-end">
            <h2 class="font-sora text-sg-heading-6 text-background-3 font-normal tracking-[-0.6px]">
              Dev team
            </h2>
            <div class="space-y-6">
              <!-- avatar group  -->
              <div class="flex items-center justify-end -space-x-3">
                <figure
                  data-opai-animate
                  data-delay="0.5"
                  data-instant
                  data-direction="left"
                  data-offset="100"
                  class="size-9 overflow-hidden rounded-md ring-1 ring-white xl:size-11"
                >
                  <img
                    src="./images/opai-avatar-img-03.png"
                    alt="Development team member"
                    class="size-full object-cover"
                  />
                </figure>
                <figure
                  data-opai-animate
                  data-delay="0.6"
                  data-instant
                  data-direction="left"
                  data-offset="100"
                  class="size-9 overflow-hidden rounded-md ring-1 ring-white xl:size-11"
                >
                  <img
                    src="./images/opai-avatar-img-02.png"
                    alt="Development team member"
                    class="size-full object-cover"
                  />
                </figure>
                <figure
                  data-opai-animate
                  data-delay="0.7"
                  data-instant
                  data-direction="left"
                  data-offset="100"
                  class="size-9 overflow-hidden rounded-md ring-1 ring-white xl:size-11"
                >
                  <img
                    src="./images/opai-avatar-img-14.png"
                    alt="Development team member"
                    class="size-full object-cover"
                  />
                </figure>

                <div
                  data-opai-animate
                  data-delay="0.8"
                  data-instant
                  data-direction="left"
                  data-offset="100"
                  class="flex size-9 rotate-270 items-center justify-center overflow-hidden rounded-md bg-(image:--color-gradient-5) ring-1 ring-white xl:size-11"
                  aria-label="Additional team members"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    aria-hidden="true"
                  >
                    <path
                      d="M3.75 12H20.25"
                      stroke="white"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                    <path
                      d="M12 3.75V20.25"
                      stroke="white"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>
                </div>
              </div>

              <!-- text  -->
              <div class="flex items-end justify-between">
                <div class="text-left">
                  <p class="font-inter-tight text-tagline-2 text-background-3 font-normal">
                    Efficiency
                  </p>
                  <h3
                    class="font-sora text-sg-heading-5 xl:text-sg-heading-3 text-background-3 flex items-center justify-center font-normal tracking-[-1.6px]"
                  >
                    <span
                      data-counter
                      data-number="87"
                      data-speed="1400"
                      data-interval="200"
                      data-rooms="2"
                      data-height-space="2.1"
                      >87 </span
                    >%
                  </h3>
                </div>

                <div
                  class="bg-background-3 flex items-center justify-center gap-x-1 rounded-lg px-2.5 py-1"
                >
                  <span
                    class="font-manrope text-manrope-heading-6 flex items-center justify-center text-white"
                  >
                    <span
                      data-counter
                      data-number="4"
                      data-speed="2000"
                      data-interval="200"
                      data-rooms="1"
                      >4</span
                    >
                  </span>
                  <span class="flex size-6 items-center justify-center" aria-hidden="true">
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="17"
                      height="19"
                      viewBox="0 0 17 19"
                      fill="none"
                      class="shrink-0"
                      aria-hidden="true"
                      role="img"
                    >
                      <path
                        d="M16.5 8.26066C16.5 12.5468 13.0528 15.5 8.5 15.5V17.5C4 17 0.5 12.426 0.5 8.26066C0.5 3.97457 3.95638 0.5 8.5092 0.5C13.062 0.5 16.5 3.97457 16.5 8.26066Z"
                        stroke="white"
                      />
                    </svg>
                  </span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- card three  -->
      <figure
        data-move-up-on-scroll-element
        data-opai-animate
        data-delay="0.7"
        data-instant
        data-direction="left"
        data-offset="100"
        class="lp:top-[60%] lp:left-[-2%] absolute top-[80%] left-[1%] hidden w-full max-w-[300px] overflow-hidden rounded-3xl md:inline-block lg:top-[60%] xl:max-w-[374px] 2xl:top-[56%] 2xl:left-[-3%]"
      >
        <img
          src="./images/opai-img-301.png"
          alt="AI technology showcase"
          class="size-full object-cover"
        />
      </figure>
    </div>
  </div>
</section>
