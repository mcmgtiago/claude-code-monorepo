<!-- experience section -->
<section
  class="overflow-hidden py-[80px] md:py-[120px] xl:py-[156px]"
  aria-labelledby="experience-heading"
  itemscope
  itemtype="https://schema.org/ItemList"
>
  <div class="main-container">
    <div class="space-y-19">
      <!-- content  -->
      <div class="space-y-3">
        <h2
          data-text-reveal
          class="font-sora text-sora-heading-4 md:text-sora-heading-3 lg:text-sora-heading-2 text-background-13/90 mx-auto text-center font-normal"
        >
          Experience AI in action
        </h2>
        <p
          data-text-reveal
          data-delay="0.2"
          id="experience-description"
          class="font-inter-tight text-tagline-2 text-background-13/60 mx-auto text-center font-normal"
          aria-describedby="experience-heading"
        >
          See how we've delivered measurable success to our clients.
        </p>
      </div>

      <!-- cards + btn -->
      <div class="space-y-14" role="list" aria-label="AI experience showcase cards">
        <!-- card  -->
        <div
          data-opai-animate
          data-delay="0.3"
          class="grid grid-cols-12 items-start gap-4 lg:gap-2"
        >
          <!-- card one  -->
          <div
            class="col-span-12 md:col-span-6 lg:col-span-4 xl:col-span-6"
            role="listitem"
            itemscope
            itemtype="https://schema.org/Product"
          >
            <div
              class="flex h-[300px] flex-col-reverse items-center justify-between rounded-3xl bg-white p-6 xl:flex-row xl:p-8"
              aria-label="Neural Networks builders feature card"
            >
              <h3
                class="text-background-13/90 font-sora text-sora-heading-5 font-normal tracking-[-0.72px] xl:max-w-[189px]"
                itemprop="name"
              >
                Neural Networks builders
              </h3>
              <figure class="w-full max-w-[230px] overflow-hidden rounded-xl xl:max-w-[262px]">
                <img
                  src="./images/opai-img-305.png"
                  alt="Neural Networks builders"
                  class="size-full object-cover"
                  itemprop="image"
                  loading="lazy"
                  decoding="async"
                />
              </figure>
            </div>
          </div>

          <!-- card two  -->
          <div
            class="col-span-12 md:col-span-6 lg:col-span-4 xl:col-span-3"
            role="listitem"
            itemscope
            itemtype="https://schema.org/Product"
          >
            <div
              class="flex h-[300px] flex-col justify-between rounded-3xl bg-white px-8 pt-8 pb-8 xl:h-[420px] xl:pt-[111px]"
              aria-label="Multilingual NLP models feature card"
            >
              <div
                class="relative mx-auto h-[151px] w-[230px]"
                role="group"
                aria-label="Multilingual NLP models visualization"
              >
                <figure
                  data-opai-animate
                  data-delay="0.4"
                  class="absolute top-0 left-1/2 z-4 w-[230px] -translate-x-1/2 overflow-hidden rounded-xl"
                >
                  <img
                    src="./images/opai-img-311.png"
                    alt="Multilingual NLP models"
                    class="size-full object-cover"
                    loading="lazy"
                    decoding="async"
                  />
                </figure>

                <div
                  data-opai-animate
                  data-delay="0.5"
                  class="bg-background-9 absolute top-1 left-1/2 z-3 h-[129px] w-[218px] -translate-x-1/2 rounded-xl"
                  aria-hidden="true"
                ></div>
                <div
                  data-opai-animate
                  data-delay="0.6"
                  class="bg-background-9 absolute top-1 left-1/2 z-3 h-[138px] w-[206px] -translate-x-1/2 rounded-xl"
                  aria-hidden="true"
                ></div>
                <div
                  data-opai-animate
                  data-delay="0.7"
                  class="bg-background-9 absolute top-1 left-1/2 z-3 h-[147px] w-[192px] -translate-x-1/2 rounded-xl"
                  aria-hidden="true"
                ></div>
              </div>
              <!-- text  -->
              <h3
                class="text-background-13/90 font-sora text-sora-heading-5 font-normal tracking-[-0.72px]"
                itemprop="name"
              >
                Multilingual NLP models
              </h3>
            </div>
          </div>

          <!-- card three  -->
          <div
            class="col-span-12 md:col-span-6 lg:col-span-4 xl:col-span-3"
            role="listitem"
            itemscope
            itemtype="https://schema.org/Product"
          >
            <div
              class="flex h-[300px] flex-col justify-between rounded-3xl bg-white px-8 pt-8 pb-8 lg:pt-8 xl:h-[420px] xl:pt-[77px]"
              aria-label="AI-driven cybersecurity feature card"
            >
              <!-- lock icon -->
              <div
                class="lock-fade-animation-delay-1 bg-background-7 relative mx-auto size-40 rounded-full"
                role="img"
                aria-label="Security lock icon representing AI-driven cybersecurity"
              >
                <div
                  class="lock-fade-animation-delay-2 bg-background-8 absolute top-1/2 left-1/2 size-29 -translate-x-1/2 -translate-y-1/2 rounded-full"
                  aria-hidden="true"
                >
                  <div
                    class="bg-background-5 lock-fade-animation-delay-3 absolute top-1/2 left-1/2 flex size-17 -translate-x-1/2 -translate-y-1/2 items-center justify-center rounded-full px-3.5 py-3"
                    aria-hidden="true"
                  >
                    <figure class="h-[52px] w-[50px]">
                      <img
                        src="./images/lock-3.svg"
                        alt="Security lock icon for AI-driven cybersecurity"
                        class="size-full shrink-0 object-contain"
                        loading="lazy"
                        decoding="async"
                      />
                    </figure>
                  </div>
                </div>
              </div>

              <!-- text  -->
              <h3
                class="text-background-13/90 font-sora text-sora-heading-5 font-normal tracking-[-0.72px]"
                itemprop="name"
              >
                AI-driven cybersecurity
              </h3>
            </div>
          </div>

          <!-- card four  -->
          <div
            class="order-last col-span-12 md:col-span-6 lg:order-4 xl:col-span-3 xl:-mt-[120px]"
            role="listitem"
            itemscope
            itemtype="https://schema.org/Product"
          >
            <div
              class="flex h-[420px] flex-col justify-between rounded-3xl bg-white p-8"
              aria-label="Computer vision modules feature card"
            >
              <!-- images  -->
              <div
                data-opai-animate
                data-delay="0.2"
                class="relative h-[252px] w-full"
                role="group"
                aria-label="Computer vision modules images"
              >
                <figure
                  class="absolute top-1/2 left-1/2 z-10 w-full max-w-[190px] -translate-x-1/2 -translate-y-1/2 overflow-hidden rounded-[20px]"
                >
                  <img
                    src="./images/opai-img-307.png"
                    alt="Computer vision modules img two"
                    class="size-full object-cover"
                    loading="lazy"
                    decoding="async"
                  />
                </figure>

                <figure
                  data-opai-animate
                  data-delay="0.3"
                  class="absolute top-[74px] left-0 z-20 w-full max-w-[159px] overflow-hidden rounded-[20px]"
                >
                  <img
                    src="./images/opai-img-306.png"
                    alt="Computer vision modules img one"
                    class="size-full object-cover"
                    loading="lazy"
                    decoding="async"
                  />
                </figure>
                <figure
                  data-opai-animate
                  data-delay="0.4"
                  class="absolute right-0 bottom-0 z-0 w-full max-w-[159px] overflow-hidden rounded-[20px]"
                >
                  <img
                    src="./images/opai-img-308.png"
                    alt="Computer vision modules img three"
                    class="size-full object-cover"
                    loading="lazy"
                    decoding="async"
                  />
                </figure>
              </div>

              <!-- text  -->
              <h3
                class="text-background-13/90 font-sora text-sora-heading-5 font-normal tracking-[-0.72px]"
                itemprop="name"
              >
                Computer vision modules
              </h3>
            </div>
          </div>

          <!-- card five  -->
          <div
            class="col-span-12 md:order-5 md:col-span-6 lg:order-4 xl:col-span-3 xl:-mt-[120px]"
            role="listitem"
            itemscope
            itemtype="https://schema.org/Product"
          >
            <div
              class="flex h-[420px] flex-col justify-between rounded-3xl bg-white p-8"
              aria-label="Recommendation systems feature card"
            >
              <!-- images  -->
              <div
                data-opai-animate
                data-delay="0.4"
                class="relative top-4 left-1/2 h-[220px] w-[206px] -translate-x-1/2"
                role="group"
                aria-label="Recommendation systems images"
              >
                <figure
                  data-opai-animate
                  data-delay="0.5"
                  data-instant
                  data-rotation="7.7"
                  data-animation-type="to"
                  data-offset="0"
                  class="absolute top-0 right-2 z-10 w-[124px] overflow-hidden rounded-[20px]"
                >
                  <img
                    src="./images/opai-img-310.png"
                    alt="Recommendation systems"
                    class="size-full object-cover"
                    loading="lazy"
                    decoding="async"
                  />
                </figure>
                <figure
                  data-opai-animate
                  data-delay="0.6"
                  data-instant
                  class="absolute bottom-0 left-1/2 z-20 w-[164px] -translate-x-1/2 overflow-hidden rounded-[20px]"
                >
                  <img
                    src="./images/opai-img-309.png"
                    alt="Recommendation systems"
                    class="size-full object-cover"
                    loading="lazy"
                    decoding="async"
                  />
                </figure>

                <div
                  data-opai-animate
                  data-delay="0.7"
                  data-instant
                  data-rotation="-7.7"
                  data-animation-type="to"
                  data-offset="0"
                  class="bg-background-10 absolute bottom-8 left-3 z-10 h-[147px] w-[124px] rounded-[20px]"
                  aria-hidden="true"
                ></div>
              </div>
              <!-- text  -->
              <h3
                class="text-background-13/90 font-sora text-sora-heading-5 font-normal tracking-[-0.72px]"
                itemprop="name"
              >
                Recommendation systems
              </h3>
            </div>
          </div>

          <!-- card six -->
          <div
            class="order-last col-span-12 md:order-4 md:col-span-6 lg:order-last lg:col-span-12 xl:col-span-6"
            role="listitem"
            itemscope
            itemtype="https://schema.org/Product"
          >
            <div
              class="flex h-[300px] flex-col items-start justify-between rounded-3xl bg-white p-8"
              aria-label="Insightful dashboards feature card"
            >
              <figure
                data-opai-animate
                data-delay="0.7"
                class="w-full max-w-[569px] overflow-hidden rounded-md"
              >
                <img
                  src="./images/opai-img-312.png"
                  alt="AI technology showcase dashboard visualization"
                  class="size-full object-cover"
                  itemprop="image"
                  loading="lazy"
                  decoding="async"
                />
              </figure>

              <!-- text  -->
              <h3
                class="text-background-13/90 font-sora text-sora-heading-5 text-left font-normal tracking-[-0.72px]"
                itemprop="name"
              >
                Insightful dashboards
              </h3>
            </div>
          </div>
        </div>
        <!-- btn  -->
        <div
          data-opai-animate
          data-delay="0.8"
          class="text-center"
          role="region"
          aria-label="Call to action"
        >
          <Component
            src="src/components/shared/button/link-primary.htm"
            button-text="Try a live demo"
            href="./pricing.htm"
            aria-label="Try a live demo of our AI solutions"
          />
        </div>
      </div>
    </div>
  </div>
</section>
