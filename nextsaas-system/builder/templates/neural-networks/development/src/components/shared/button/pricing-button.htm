<a href="{=$href}" class="w-full">
  <div class="group h-[52px] cursor-pointer overflow-hidden rounded-2xl text-center">
    <div
      class="bg-background-10 font-ibm-plex-mono text-tagline-2 text-background-6 flex w-full cursor-pointer flex-nowrap items-center justify-center gap-x-2.5 rounded-2xl px-6 py-[13px] font-normal lowercase"
    >
      <span class="shrink-0 first-letter:uppercase"> {=$button-text} </span>
      <!-- arrow icon  -->
      <div class="relative top-[1.5px] flex size-6 items-center justify-center overflow-hidden">
        <span
          class="absolute flex translate-x-0 items-center justify-center opacity-100 transition-all duration-500 ease-[cubic-bezier(0.4,0,0.2,1)] group-hover:translate-x-6 group-hover:opacity-0"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 18 18"
            fill="none"
          >
            <path
              d="M6.75 13.5L11.25 9L6.75 4.5"
              stroke="#0D1017"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
        <span
          class="absolute flex -translate-x-6 items-center justify-center opacity-0 transition-all duration-500 ease-[cubic-bezier(0.4,0,0.2,1)] group-hover:translate-x-0 group-hover:opacity-100"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 18 18"
            fill="none"
          >
            <path
              d="M6.75 13.5L11.25 9L6.75 4.5"
              stroke="#0D1017"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
      </div>
    </div>
  </div>
</a>
