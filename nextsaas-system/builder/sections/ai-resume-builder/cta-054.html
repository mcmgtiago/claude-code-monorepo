      <!-- =========================
CTA section
===========================-->
<section class="py-16 lg:py-22 xl:py-28">
  <div class="main-container">
    <div
      data-ns-animate
      data-delay="0.1"
      class="text-center bg-background-12 rounded-4xl space-y-8 overflow-hidden mx-auto py-28 px-5 flex flex-col items-center justify-center relative z-0"
    >
      <figure
        class="absolute -left-[10%] select-none pointer-events-none md:-left-[5%] lg:left-0 -bottom-10"
        data-ns-animate
        data-delay="0.3"
        data-direction="left"
        data-offset="90"
        data-spring="true"
        data-duration="2.4"
      >
        <img
          src="./images/ns-img-336.svg"
          alt="cta image"
          class="select-none pointer-events-none max-sm:scale-75"
        />
      </figure>
      <figure
        class="absolute -right-[16%] select-none pointer-events-none md:-right-[10%] lg:right-0 top-0"
        data-ns-animate
        data-delay="0.3"
        data-direction="right"
        data-offset="90"
        data-spring="true"
        data-duration="2.4"
      >
        <img
          src="./images/ns-img-337.svg"
          alt="cta image"
          class="select-none pointer-events-none max-sm:scale-75"
        />
      </figure>
      <div class="space-y-2">
        <h2 data-ns-animate data-delay="0.1">Get noticed. get hired. get started.</h2>
        <p data-ns-animate data-delay="0.2">
          Create a resume that’s tailored, professional, and ready to
          <br class="lg:block hidden" />
          impress—powered by NestSaaS.
        </p>
      </div>

      <div
        class="flex flex-col md:flex-row gap-4 justify-center items-center max-md:w-full md:w-auto mx-auto md:mx-0"
      >
        <div
          data-ns-animate
          data-delay="0.3"
          data-direction="left"
          data-offset="50"
          class="w-[90%] sm:w-auto"
        >
          <div
  class="group/btn-v2 {=$class} mx-auto inline-block w-[85%] rounded-full transition-transform duration-500 ease-in-out md:mx-0 md:w-auto"
>
  <a
    href="./login.html"
    class="btn-xl-v2 btn-secondary-v2 group-hover/btn-v2:btn-primary-v2 mx-auto inline-flex h-12 w-full cursor-pointer items-center justify-center gap-1.5 rounded-full text-center font-medium text-nowrap lowercase transition-all duration-500 ease-in-out md:mx-0 md:h-auto md:w-auto"
  >
    <span class="inline-block transition-transform duration-300 ease-in-out first-letter:uppercase"
      >Get started now
    </span>

    <div class="relative size-6 overflow-hidden">
      <!-- one  -->
      <span
        class="btn-v2-icon absolute inset-0 size-6 -translate-x-6 transition-all duration-300 ease-in-out group-hover/btn-v2:translate-x-1"
      >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M11 5H13V7H11V5Z" />
          <path d="M5 5H7V7H5V5Z" />
          <path d="M14 8H16V10H14V8Z" />
          <path d="M8 8H10V10H8V8Z" />
          <path d="M17 11H19V13H17V11Z" />
          <path d="M11 11H13V13H11V11Z" />
          <path d="M14 14H16V16H14V14Z" />
          <path d="M8 14H10V16H8V14Z" />
          <path d="M11 17H13V19H11V17Z" />
          <path d="M5 17H7V19H5V17Z" />
        </svg>
      </span>

      <!-- two  -->
      <span
        class="btn-v2-icon absolute size-6 -translate-x-2 transition-all duration-300 ease-in-out group-hover/btn-v2:translate-x-6"
      >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M11 5H13V7H11V5Z" />
          <path d="M5 5H7V7H5V5Z" />
          <path d="M14 8H16V10H14V8Z" />
          <path d="M8 8H10V10H8V8Z" />
          <path d="M17 11H19V13H17V11Z" />
          <path d="M11 11H13V13H11V11Z" />
          <path d="M14 14H16V16H14V14Z" />
          <path d="M8 14H10V16H8V14Z" />
          <path d="M11 17H13V19H11V17Z" />
          <path d="M5 17H7V19H5V17Z" />
        </svg>
      </span>
    </div>
  </a>
</div>

        </div>
      </div>
    </div>
  </div>
</section>
