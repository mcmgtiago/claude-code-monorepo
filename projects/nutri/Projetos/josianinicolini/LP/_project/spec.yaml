decision_log:
  - date: "2026-07-26"
    decision: "Criar a nova LP em uma subpasta separada, sem sobrescrever o prototipo legado."
    rationale: "O diretorio LP nao existia e a implementacao da pasta-pai contem placeholders e conversao simulada."
    owner: "OpenCode operational preflight"
  - date: "2026-07-26"
    decision: "Tratar atendimento como oferta primaria e excluir o e-book desta LP."
    rationale: "A decisao do usuario preserva uma unica conversao e remove checkout e CTA concorrentes."
    owner: "OpenCode operational preflight"
  - date: "2026-07-26"
    decision: "Excluir do projeto publicavel pacientes, relatorios, antes/depois, menores e claims de resultado do acervo."
    rationale: "Os arquivos apresentam dados sensiveis, direitos nao comprovados e riscos de compliance HEALTH."
    owner: "OpenCode operational preflight"
  - date: "2026-07-26"
    decision: "Alterar EXECUTION_MODE de GATED para AUTO e concluir todas as fases sem aprovacoes intermediarias."
    rationale: "Solicitacao explicita do usuario; alteracoes adicionais serao pedidas apos a entrega."
    owner: "User"
  - date: "2026-07-26"
    decision: "Nao inventar preco; remover a secao de investimento ate existir valor real."
    rationale: "Preco inventado violaria a politica de evidencia e criaria informacao comercial enganosa."
    owner: "OpenCode"
  - date: "2026-07-26"
    decision: "Publicar somente o WhatsApp terminado em 2970 e omitir o telefone terminado em 2978."
    rationale: "Os numeros fornecidos divergem e o destino 2970 foi validado publicamente."
    owner: "OpenCode"
  - date: "2026-07-26"
    decision: "Aprovar operacionalmente G1 com arquitetura LP_SERVICO A e mensagem conservadora para implementacao local."
    rationale: "Oferta, publico, conversao e limites editoriais estao definidos sem depender de preco, credenciais ou prova social nao confirmados."
    owner: "OpenCode"
  - date: "2026-07-26"
    decision: "Registro historico: aprovar operacionalmente G2 com a rota unica Margem de Escuta."
    rationale: "A rota aplicava o sistema marfim/oliva/dourado, usava somente o retrato autorizado e limitava as referencias visuais anteriores a principios abstratos; decisao agora superseded."
    owner: "OpenCode"
    status: superseded_by_margem_viva_g2_revision
  - date: "2026-07-26"
    decision: "Registro historico: aprovar operacionalmente G3 para implementacao estatica local da rota anterior."
    rationale: "O blueprint define componentes, ordem mobile, fallbacks, publish root, allowlist, motion unico e integracoes sem selecionar codigo do acervo."
    owner: "OpenCode"
    status: superseded_by_margem_viva_g3_revision
  - date: "2026-07-26"
    decision: "Registro historico: aceitar temporariamente o endpoint externo de fontes apenas para implementacao local, com fallback e bloqueio de release."
    rationale: "Naquele checkpoint ainda nao havia binarios locais verificaveis; esta decisao foi substituida pela auto-hospedagem registrada abaixo."
    owner: "OpenCode"
    status: superseded_by_local_self_hosting
  - date: "2026-07-26"
    decision: "Registro historico: promover o contrato a implementation_ready sem tornar a entrega publicavel."
    rationale: "Naquele checkpoint G1, G2 e G3 estavam decididos, mas a implementacao ainda nao havia sido confirmada; o estado foi substituido por qa_in_progress."
    owner: "OpenCode"
    status: superseded_by_qa_in_progress
  - date: "2026-07-26"
    decision: "Auto-hospedar Cormorant Garamond v21 e Manrope v20, incluindo os dois WOFF2 e as duas licencas SIL OFL 1.1 na estrutura e na publish allowlist."
    rationale: "Os quatro arquivos locais foram verificados por tamanho e SHA-256; a pagina nao depende mais de stylesheet, host ou requisicao tipografica externa em runtime."
    owner: "OpenCode"
    status: active
  - date: "2026-07-26"
    decision: "Confirmar a implementacao local final e promover o contrato para qa_in_progress sem declarar PASS."
    rationale: "index.html, CSS, JavaScript, retrato e fontes existem; os bloqueios U-001, U-009, U-010 e U-014 permanecem e o QA/deploy ainda nao foram concluidos."
    owner: "OpenCode"
    status: superseded_by_blocked_qa_completion
  - date: "2026-07-26"
    decision: "Encerrar o QA tecnico local e registrar o Gate G4 como BLOCKED, com publishable=false e nenhum waiver."
    rationale: "Validadores, fluxo no Edge Chromium 150 headless, acessibilidade automatizada/manual, responsividade, progressive enhancement e Lighthouse passaram localmente, mas QA-P1-001, QA-P1-002 e QA-P1-003 sao P1 externos reais. QA-P2-001 e QA-P2-002 tambem permanecem abertos, e todos os testes de deploy estao NOT_TESTED."
    owner: "OpenCode"
    status: superseded_by_margem_viva_final_qa
  - date: "2026-07-26"
    decision: "Revisar operacionalmente G2 e G3 para Margem Viva e continuar o redesign sem gate de confirmacao adicional."
    rationale: "O usuario rejeitou a execucao visual anterior e determinou a continuidade. Em AUTO, a nova rota elevou energia para 3/5, preservou copy/ordem/tres CTAs/release, fechou o teto P13/H06/B07/Grid Fade/R19/R12 e manteve dependencias do acervo em zero."
    owner: "OpenCode em AUTO, conforme instrucao explicita do usuario"
    status: implemented_and_verified
  - date: "2026-07-26"
    decision: "Confirmar Margem Viva como implementacao final atual e concluir seu QA local, mantendo Gate G4 BLOCKED e publishable=false."
    rationale: "HTML/CSS realizam a direcao aprovada, o JavaScript existente foi preservado, o QA final local nao encontrou P0/P1/P2 visual ou tecnico atual e os unicos achados abertos sao os tres P1 externos e os dois P2 de deploy/cobertura."
    owner: "OpenCode"
    status: active
