visual:
  route: "Margem Viva"
  secondary_influence: null
  fingerprint:
    authority: "Humana-clinica"
    temperature: "Quente controlada"
    energy: "3 de 5"
    density: "Editorial com ritmo variavel"
    expression: "Fotografica-editorial com botanica linear original"
  concept: "Uma publicacao clinica cuja margem ganha vida: campos tipograficos, rails finos, arcos amplos e linework botanico original conduzem o olhar pelas bordas, enquanto o centro preserva leitura, evidencia e conversao; o retrato aproxima sem funcionar como prova clinica."
  composition:
    rhythm: "Variavel: faixa operacional compacta, identificacao como pausa, splits assimetricos e processo como bloco de maior densidade; nao repetir o mesmo grid entre abordagem, processo e modalidades."
    desktop:
      - "Header editorial com assinatura, nav de quatro ancoras reais e CTA canonico."
      - "Hero assimetrico com copy em campo proprio antes do retrato dominante, alto e recortado; legenda operacional e linework fora do rosto."
      - "Faixa logistica oliva estatica; identificacao tipografica; abordagem em split com pilares empilhados."
      - "Processo assinatura: campo oliva, Grid Fade e rails estaticos, titulo grande a esquerda e exatamente tres cards marfim discretamente deslocados a direita."
      - "Atendimento/adequacao em split; Sobre com grande gesto tipografico; modalidades em dois paineis; FAQ nativo numerado; CTA final em duas zonas."
    mobile:
      - "Mobile-first desde 320px, uma coluna, DOM preservado, CTA antes do retrato, body 16px ou maior e alvos de 44px."
      - "Nav pode ser ocultada sem menu JS; ornamentos e rails sao removiveis; nenhum overflow horizontal ou dependencia de hover."
      - "Baixa altura permanece em fluxo normal, sem 100vh, pinning ou sticky obrigatorio."
      - "H1 factual em 40-48px e 4-6 linhas; 5 linhas observadas em 320px e 375px, com primeira dobra ajustada sem reduzir abaixo de 40px."
    continuous_motion: "none; marquee rejected because it adds no information and creates unnecessary continuous movement"
