<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050c18"/>
      <stop offset="100%" stop-color="#0f1d3a"/>
    </linearGradient>
    <radialGradient id="glow5" cx="50%" cy="43%" r="48%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="360" height="640" fill="url(#bg5)"/>
  <rect width="360" height="640" fill="url(#glow5)"/>
  <line x1="0" y1="160" x2="360" y2="160" stroke="#1a1a40" stroke-width="0.8"/>
  <line x1="0" y1="320" x2="360" y2="320" stroke="#1a1a40" stroke-width="0.8"/>
  <line x1="0" y1="480" x2="360" y2="480" stroke="#1a1a40" stroke-width="0.8"/>
  <line x1="120" y1="0" x2="120" y2="640" stroke="#1a1a40" stroke-width="0.8"/>
  <line x1="240" y1="0" x2="240" y2="640" stroke="#1a1a40" stroke-width="0.8"/>
  <!-- phone body -->
  <rect x="110" y="130" width="140" height="280" rx="20" ry="20" fill="#0f172a" stroke="#ec4899" stroke-width="1.5"/>
  <rect x="155" y="133" width="50" height="10" rx="5" fill="#4a044e"/>
  <rect x="120" y="152" width="120" height="218" rx="4" ry="4" fill="#0d1a2e"/>
  <!-- large face/head close-up in screen -->
  <circle cx="180" cy="215" r="52" fill="#1a103a"/>
  <!-- face features (abstract) -->
  <circle cx="163" cy="205" r="8" fill="#2d1b4e"/>
  <circle cx="197" cy="205" r="8" fill="#2d1b4e"/>
  <circle cx="163" cy="205" r="4" fill="#60a5fa"/>
  <circle cx="197" cy="205" r="4" fill="#60a5fa"/>
  <path d="M163 230 Q180 244 197 230" stroke="#ec4899" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- sparkles around face -->
  <text x="133" y="178" font-family="Arial,sans-serif" font-size="18" fill="#ec4899" opacity="0.8">✦</text>
  <text x="215" y="190" font-family="Arial,sans-serif" font-size="14" fill="#f9a8d4" opacity="0.8">✦</text>
  <text x="128" y="260" font-family="Arial,sans-serif" font-size="10" fill="#f9a8d4" opacity="0.6">✦</text>
  <!-- likes counter overlay -->
  <rect x="130" y="295" width="80" height="24" rx="12" fill="#ec4899" opacity="0.85"/>
  <text x="170" y="311" font-family="Arial,sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="bold">❤ 12.4k</text>
  <!-- home bar -->
  <rect x="155" y="400" width="50" height="4" rx="2" fill="#4a044e"/>
  <!-- label -->
  <text x="180" y="460" font-family="Arial,sans-serif" font-size="14" fill="#f9a8d4" text-anchor="middle" font-weight="600">Conteúdo que engaja</text>
  <text x="180" y="480" font-family="Arial,sans-serif" font-size="11" fill="#334155" text-anchor="middle">Edição Ninja</text>
</svg>
