<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060e18"/>
      <stop offset="100%" stop-color="#0d2230"/>
    </linearGradient>
    <radialGradient id="sun4" cx="50%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="360" height="640" fill="url(#bg4)"/>
  <rect width="360" height="640" fill="url(#sun4)"/>
  <line x1="0" y1="160" x2="360" y2="160" stroke="#1a2a35" stroke-width="0.8"/>
  <line x1="0" y1="320" x2="360" y2="320" stroke="#1a2a35" stroke-width="0.8"/>
  <line x1="0" y1="480" x2="360" y2="480" stroke="#1a2a35" stroke-width="0.8"/>
  <line x1="120" y1="0" x2="120" y2="640" stroke="#1a2a35" stroke-width="0.8"/>
  <line x1="240" y1="0" x2="240" y2="640" stroke="#1a2a35" stroke-width="0.8"/>
  <!-- sun -->
  <circle cx="290" cy="140" r="28" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>
  <circle cx="290" cy="140" r="18" fill="#f59e0b" opacity="0.5"/>
  <!-- sun rays -->
  <line x1="290" y1="105" x2="290" y2="98" stroke="#f59e0b" stroke-width="2" opacity="0.5"/>
  <line x1="314" y1="116" x2="319" y2="111" stroke="#f59e0b" stroke-width="2" opacity="0.5"/>
  <line x1="325" y1="140" x2="332" y2="140" stroke="#f59e0b" stroke-width="2" opacity="0.5"/>
  <line x1="314" y1="164" x2="319" y2="169" stroke="#f59e0b" stroke-width="2" opacity="0.5"/>
  <line x1="266" y1="116" x2="261" y2="111" stroke="#f59e0b" stroke-width="2" opacity="0.5"/>
  <!-- ground/horizon -->
  <rect x="0" y="400" width="360" height="240" fill="#0a1520" opacity="0.5"/>
  <line x1="0" y1="400" x2="360" y2="400" stroke="#1e4060" stroke-width="1"/>
  <!-- phone body -->
  <rect x="110" y="130" width="140" height="280" rx="20" ry="20" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="155" y="133" width="50" height="10" rx="5" fill="#451a03"/>
  <rect x="120" y="152" width="120" height="218" rx="4" ry="4" fill="#0d1a2e"/>
  <!-- outdoor content in screen -->
  <rect x="120" y="152" width="120" height="100" rx="4" ry="4" fill="#0e2a1a"/>
  <path d="M120 252 Q150 220 180 240 Q210 260 240 230 L240 252 Z" fill="#1a4a28"/>
  <!-- person silhouette outdoor -->
  <circle cx="180" cy="210" r="20" fill="#2d5a20" opacity="0.8"/>
  <path d="M160 235 Q180 225 200 235" fill="#2d5a20" opacity="0.8"/>
  <!-- REC badge -->
  <rect x="126" y="158" width="48" height="18" rx="4" fill="#dc2626"/>
  <circle cx="136" cy="167" r="4" fill="white"/>
  <text x="144" y="171" font-family="Arial,sans-serif" font-size="9" fill="white" font-weight="bold">REC</text>
  <!-- play overlay -->
  <circle cx="180" cy="305" r="22" fill="#f59e0b" opacity="0.85"/>
  <polygon points="173,296 173,314 191,305" fill="white"/>
  <!-- home bar -->
  <rect x="155" y="400" width="50" height="4" rx="2" fill="#451a03"/>
  <!-- label -->
  <text x="180" y="460" font-family="Arial,sans-serif" font-size="14" fill="#fbbf24" text-anchor="middle" font-weight="600">Vlogger ao ar livre</text>
  <text x="180" y="480" font-family="Arial,sans-serif" font-size="11" fill="#334155" text-anchor="middle">Edição Ninja</text>
</svg>
