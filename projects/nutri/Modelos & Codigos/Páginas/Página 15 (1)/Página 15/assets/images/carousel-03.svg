<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050c18"/>
      <stop offset="100%" stop-color="#0c1e35"/>
    </linearGradient>
    <radialGradient id="glow3" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="360" height="640" fill="url(#bg3)"/>
  <rect width="360" height="640" fill="url(#glow3)"/>
  <line x1="0" y1="160" x2="360" y2="160" stroke="#0f2035" stroke-width="0.8"/>
  <line x1="0" y1="320" x2="360" y2="320" stroke="#0f2035" stroke-width="0.8"/>
  <line x1="0" y1="480" x2="360" y2="480" stroke="#0f2035" stroke-width="0.8"/>
  <line x1="120" y1="0" x2="120" y2="640" stroke="#0f2035" stroke-width="0.8"/>
  <line x1="240" y1="0" x2="240" y2="640" stroke="#0f2035" stroke-width="0.8"/>
  <!-- phone body slightly tilted -->
  <g transform="translate(180,270) rotate(-4) translate(-70,-140)">
    <rect width="140" height="280" rx="20" ry="20" fill="#0f172a" stroke="#0891b2" stroke-width="1.5"/>
    <rect x="45" y="3" width="50" height="10" rx="5" fill="#164e63"/>
    <rect x="10" y="22" width="120" height="218" rx="4" ry="4" fill="#0c2a3a"/>
    <!-- scissors icon (editing symbol) -->
    <g transform="translate(60,70)">
      <!-- Scissors top blade -->
      <circle cx="8" cy="8" r="10" fill="none" stroke="#0891b2" stroke-width="2.5"/>
      <circle cx="12" cy="52" r="10" fill="none" stroke="#0891b2" stroke-width="2.5"/>
      <line x1="15" y1="15" x2="55" y2="55" stroke="#0891b2" stroke-width="3" stroke-linecap="round"/>
      <line x1="5" y1="45" x2="55" y2="55" stroke="#0891b2" stroke-width="3" stroke-linecap="round"/>
      <line x1="55" y1="55" x2="95" y2="15" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    </g>
    <!-- timeline bar at bottom of screen -->
    <rect x="10" y="200" width="120" height="10" rx="4" fill="#164e63"/>
    <rect x="10" y="200" width="60" height="10" rx="4" fill="#0891b2"/>
    <circle cx="70" cy="205" r="6" fill="white"/>
    <rect x="45" y="215" width="50" height="4" rx="2" fill="#0e3a50"/>
  </g>
  <!-- label -->
  <text x="180" y="460" font-family="Arial,sans-serif" font-size="14" fill="#22d3ee" text-anchor="middle" font-weight="600">Editando no celular</text>
  <text x="180" y="480" font-family="Arial,sans-serif" font-size="11" fill="#334155" text-anchor="middle">Edição Ninja</text>
</svg>
