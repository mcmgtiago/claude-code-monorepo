<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bgM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050c18"/>
      <stop offset="100%" stop-color="#0d1f3a"/>
    </linearGradient>
    <radialGradient id="glowM" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bgM)"/>
  <rect width="640" height="360" fill="url(#glowM)"/>
  <line x1="0" y1="90" x2="640" y2="90" stroke="#0f1f3a" stroke-width="1"/>
  <line x1="0" y1="180" x2="640" y2="180" stroke="#0f1f3a" stroke-width="1"/>
  <line x1="0" y1="270" x2="640" y2="270" stroke="#0f1f3a" stroke-width="1"/>
  <line x1="160" y1="0" x2="160" y2="360" stroke="#0f1f3a" stroke-width="1"/>
  <line x1="320" y1="0" x2="320" y2="360" stroke="#0f1f3a" stroke-width="1"/>
  <line x1="480" y1="0" x2="480" y2="360" stroke="#0f1f3a" stroke-width="1"/>
  <!-- phone illustration -->
  <rect x="60" y="50" width="130" height="240" rx="16" ry="16" fill="#0f172a" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="95" y="53" width="60" height="10" rx="5" fill="#1e293b"/>
  <rect x="70" y="72" width="110" height="190" rx="4" ry="4" fill="#0d1a2e"/>
  <!-- play screen content in phone -->
  <rect x="70" y="72" width="110" height="140" rx="4" ry="4" fill="#0e2240"/>
  <!-- person silhouette in phone screen -->
  <circle cx="125" cy="110" r="22" fill="#1e3a6e"/>
  <path d="M95 140 Q125 128 155 140 L155 168 Q125 174 95 168 Z" fill="#1e3a6e"/>
  <!-- play button on phone -->
  <circle cx="125" cy="175" r="16" fill="#2563eb" opacity="0.9"/>
  <polygon points="120,168 120,182 134,175" fill="white"/>
  <!-- home bar -->
  <rect x="100" y="278" width="50" height="4" rx="2" fill="#1e293b"/>
  <!-- course modules on right side -->
  <g transform="translate(240, 40)">
    <!-- module 1 -->
    <rect x="0" y="0" width="340" height="52" rx="8" fill="#0f1f3a" stroke="#1e3a6e" stroke-width="1"/>
    <rect x="8" y="10" width="36" height="32" rx="6" fill="#1e3a6e"/>
    <polygon points="22,18 22,34 34,26" fill="#60a5fa"/>
    <text x="52" y="24" font-family="Arial,sans-serif" font-size="12" fill="#94a3b8" font-weight="600">Módulo 1</text>
    <text x="52" y="40" font-family="Arial,sans-serif" font-size="10" fill="#60a5fa">Primeiros Cortes no Celular</text>
    <!-- progress bar -->
    <rect x="8" y="46" width="324" height="3" rx="1.5" fill="#1e3a6e"/>
    <rect x="8" y="46" width="280" height="3" rx="1.5" fill="#2563eb"/>
  </g>
  <g transform="translate(240, 102)">
    <rect x="0" y="0" width="340" height="52" rx="8" fill="#0f1f3a" stroke="#1e3a6e" stroke-width="1"/>
    <rect x="8" y="10" width="36" height="32" rx="6" fill="#1e3a6e"/>
    <polygon points="22,18 22,34 34,26" fill="#60a5fa"/>
    <text x="52" y="24" font-family="Arial,sans-serif" font-size="12" fill="#94a3b8" font-weight="600">Módulo 2</text>
    <text x="52" y="40" font-family="Arial,sans-serif" font-size="10" fill="#60a5fa">Trilha Sonora e Legendas</text>
    <rect x="8" y="46" width="324" height="3" rx="1.5" fill="#1e3a6e"/>
    <rect x="8" y="46" width="180" height="3" rx="1.5" fill="#2563eb"/>
  </g>
  <g transform="translate(240, 164)">
    <rect x="0" y="0" width="340" height="52" rx="8" fill="#0f1f3a" stroke="#1e3a6e" stroke-width="1"/>
    <rect x="8" y="10" width="36" height="32" rx="6" fill="#1e3a6e"/>
    <polygon points="22,18 22,34 34,26" fill="#60a5fa"/>
    <text x="52" y="24" font-family="Arial,sans-serif" font-size="12" fill="#94a3b8" font-weight="600">Módulo 3</text>
    <text x="52" y="40" font-family="Arial,sans-serif" font-size="10" fill="#60a5fa">Efeitos e Transições</text>
    <rect x="8" y="46" width="324" height="3" rx="1.5" fill="#1e3a6e"/>
    <rect x="8" y="46" width="60" height="3" rx="1.5" fill="#2563eb"/>
  </g>
  <!-- title -->
  <text x="320" y="276" font-family="Arial,sans-serif" font-size="15" fill="#60a5fa" text-anchor="middle" font-weight="700">Módulos de Edição pelo Celular</text>
  <text x="320" y="296" font-family="Arial,sans-serif" font-size="11" fill="#334155" text-anchor="middle">Aulas gravadas · do básico ao avançado · Edição Ninja</text>
</svg>
