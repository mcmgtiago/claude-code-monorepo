<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bgB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080e"/>
      <stop offset="100%" stop-color="#100a22"/>
    </linearGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bgB)"/>
  <rect width="640" height="360" fill="url(#glowB)"/>
  <line x1="0" y1="90" x2="640" y2="90" stroke="#12082a" stroke-width="1"/>
  <line x1="0" y1="180" x2="640" y2="180" stroke="#12082a" stroke-width="1"/>
  <line x1="0" y1="270" x2="640" y2="270" stroke="#12082a" stroke-width="1"/>
  <line x1="160" y1="0" x2="160" y2="360" stroke="#12082a" stroke-width="1"/>
  <line x1="320" y1="0" x2="320" y2="360" stroke="#12082a" stroke-width="1"/>
  <line x1="480" y1="0" x2="480" y2="360" stroke="#12082a" stroke-width="1"/>
  <!-- central lightning bolt -->
  <g transform="translate(320,180)">
    <!-- outer glow ring -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.3"/>
    <circle cx="0" cy="0" r="78" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.2"/>
    <!-- lightning bolt shape -->
    <polygon points="12,-70 -10,0 8,0 -12,70 10,0 -8,0" fill="#7c3aed" opacity="0.95"/>
    <polygon points="12,-70 -10,0 8,0 -12,70 10,0 -8,0" fill="url(#glowB)" opacity="0.4"/>
    <!-- sparkles -->
    <circle cx="-60" cy="-40" r="4" fill="#a78bfa" opacity="0.7"/>
    <circle cx="65" cy="-30" r="3" fill="#c4b5fd" opacity="0.6"/>
    <circle cx="-55" cy="50" r="5" fill="#a78bfa" opacity="0.5"/>
    <circle cx="60" cy="55" r="3" fill="#c4b5fd" opacity="0.7"/>
    <circle cx="0" cy="-90" r="3" fill="#e9d5ff" opacity="0.5"/>
  </g>
  <!-- effect cards on sides -->
  <!-- left: transition card -->
  <rect x="30" y="90" width="130" height="80" rx="10" fill="#1a0a38" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="95" y="122" font-family="Arial,sans-serif" font-size="22" text-anchor="middle">↔</text>
  <text x="95" y="148" font-family="Arial,sans-serif" font-size="10" fill="#a78bfa" text-anchor="middle" font-weight="600">Transições</text>
  <!-- right: effect card -->
  <rect x="480" y="90" width="130" height="80" rx="10" fill="#1a0a38" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="545" y="122" font-family="Arial,sans-serif" font-size="22" text-anchor="middle">✨</text>
  <text x="545" y="148" font-family="Arial,sans-serif" font-size="10" fill="#a78bfa" text-anchor="middle" font-weight="600">Efeitos Visuais</text>
  <!-- bottom cards -->
  <rect x="30" y="200" width="130" height="80" rx="10" fill="#1a0a38" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="95" y="232" font-family="Arial,sans-serif" font-size="22" text-anchor="middle">🎵</text>
  <text x="95" y="258" font-family="Arial,sans-serif" font-size="10" fill="#a78bfa" text-anchor="middle" font-weight="600">Músicas</text>
  <rect x="480" y="200" width="130" height="80" rx="10" fill="#1a0a38" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="545" y="232" font-family="Arial,sans-serif" font-size="22" text-anchor="middle">🎬</text>
  <text x="545" y="258" font-family="Arial,sans-serif" font-size="10" fill="#a78bfa" text-anchor="middle" font-weight="600">Clipes Prontos</text>
  <!-- title -->
  <text x="320" y="298" font-family="Arial,sans-serif" font-size="15" fill="#c4b5fd" text-anchor="middle" font-weight="700">Pack de Efeitos e Transições Prontas</text>
  <text x="320" y="318" font-family="Arial,sans-serif" font-size="11" fill="#334155" text-anchor="middle">Importa direto no app · Edição Ninja</text>
</svg>
