<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumera Serum</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <main class="hero" aria-label="Página de vendas">
      <div class="hero__base" aria-hidden="true"></div>
      <div class="hero__reveal" aria-hidden="true"></div>
      <div class="hero__cursor" aria-hidden="true">
        <span class="hero__corner hero__corner--tl"></span>
        <span class="hero__corner hero__corner--tr"></span>
        <span class="hero__corner hero__corner--bl"></span>
        <span class="hero__corner hero__corner--br"></span>
      </div>

      <section class="hero__copy" aria-labelledby="hero-title">
        <p class="hero__eyebrow">Lumera Serum Facial</p>
        <h1 id="hero-title">Revele uma pele mais luminosa, uniforme e hidratada desde a primeira rotina de cuidados</h1>
        <a class="hero__button" href="#">Comprar agora</a>
      </section>

      <aside class="hero__benefits" aria-label="Benefícios do produto">
        <p>Hidratação intensa por até 24h</p>
        <p>Textura leve com toque invisível</p>
        <p>Viço natural sem efeito oleoso</p>
      </aside>
    </main>

    <script src="assets/js/main.js"></script>
  </body>
</html>
