<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clean Air Hero</title>
  <meta name="description" content="Landing page com hero visual clean e foco em produto.">
  <link rel="preload" href="assets/images/hero.png" as="image">
  <link rel="preload" href="assets/images/hero1.png" as="image">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main class="page-shell">
    <section class="hero" aria-labelledby="hero-title">
      <svg class="hero__grid" aria-hidden="true" width="100%" height="100%">
        <defs>
          <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
            <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#64748b" stroke-width="0.6" />
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#grid)"></rect>
      </svg>
      <div class="hero__reveal" aria-hidden="true"></div>
      <canvas class="hero__mask-canvas" aria-hidden="true"></canvas>

      <div class="hero__content">
        <p class="hero__eyebrow">TREINAMENTO INTENSIVO PARA M&Eacute;DICOS</p>
        <h1 id="hero-title" class="hero__title">Mais seguran&ccedil;a para decidir no plant&atilde;o.</h1>
        <div class="hero__actions">
          <a class="button button--primary" href="#discover">Quero participar</a>
          <a class="button button--ghost" href="#specs">
            <span class="button__icon" aria-hidden="true"></span>
            Ver programa
          </a>
        </div>
      </div>

      <aside class="hero__authority" aria-label="Indicador de autoridade">
        <div class="hero__authority-item">
          <p class="hero__authority-number">12</p>
          <p class="hero__authority-label">m&oacute;dulos</p>
        </div>
        <div class="hero__authority-item">
          <p class="hero__authority-number">40</p>
          <p class="hero__authority-label">casos</p>
        </div>
        <div class="hero__authority-item">
          <p class="hero__authority-number">98%</p>
          <p class="hero__authority-label">aprova&ccedil;&atilde;o</p>
        </div>
      </aside>
    </section>
  </main>

  <script src="assets/js/main.js"></script>
</body>
</html>
